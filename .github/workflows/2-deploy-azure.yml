

name:  Deploy to Azure

on:
  # Ejecutar manualmente
  workflow_dispatch:
    inputs:
      IMAGE_REPOSITORY:
        description: 'Nombre del repositorio de la imagen'
        required: true
        default: 'api-vise'
      IMAGE_TAG:
        description: 'Tag de la imagen'
        required: true
        default: 'latest'
      AZURE_WEBAPP_NAME:
        description: 'Nombre del App Service en Azure'
        required: true
        default: 'vise-api-app'
      PORT:
        description: 'Puerto de la aplicación'
        default: '443'
        required: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io
  IMAGE_URL: ${{ secrets.ACR_NAME }}.azurecr.io/${{ github.event.inputs.IMAGE_REPOSITORY }}:${{ github.event.inputs.IMAGE_TAG }}
  AZURE_WEBAPP_URL: vise-api-app.azurewebsites.net

jobs:
  # ========================================
  # JOB 1: Build y Push a Azure Container Registry
  # ========================================
  build-and-push-image:
    name: 'Build y Push a ACR'
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login a Azure Container Registry
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Build y Push imagen Docker
      - name: Build and Push Docker image to ACR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE_URL }}
          file: Dockerfile

      # 4. Verificar imagen subida
      - name: Verify image pushed
        run: |
          echo " Imagen subida exitosamente a ACR:"
          echo "    Image URL: ${{ env.IMAGE_URL }}"

  # ========================================
  # JOB 2: Deploy a Azure App Service
  # ========================================
  deploy:
    name: 'Deploy a Azure App Service'
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:
      # 1. Deploy contenedor a Azure
      - name: Deploy to Azure Web App for Container
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ github.event.inputs.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_URL }}

      # 2. Confirmar deployment
      - name: Deployment confirmation
        run: |
          echo " Deployment completado"
          echo " URL: https://${{ env.AZURE_WEBAPP_URL }}"

  # ========================================
  # JOB 3: Test del servicio desplegado
  # ========================================
  test-deployment:
    name: 'Test del servicio en Azure'
    runs-on: ubuntu-latest
    needs: [build-and-push-image, deploy]

    steps:
      # 1. Esperar a que el deployment se estabilice
      - name: Wait for deployment to stabilize
        run: |
          echo " Esperando que el deployment se estabilice (90 segundos)..."
          sleep 90

      # 2. Test de conectividad
      - name: Test service connectivity
        run: |
          echo " Probando conectividad con https://${{ env.AZURE_WEBAPP_URL }}..."

          for i in {1..12}; do
            echo " Intento $i/12: Probando conectividad..."

            if curl -f -s -m 15 -o /dev/null -w "HTTP Status: %{http_code}\n" https://${{ env.AZURE_WEBAPP_URL }}; then
              echo " ¡Servicio respondiendo exitosamente!"
              exit 0
            fi

            HTTP_CODE=$(curl -s -m 15 -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_URL }} 2>&1 || echo "connection_failed")
            echo "Status: $HTTP_CODE - Esperando 10 segundos antes de reintentar..."
            sleep 10
          done

          echo " Tests de conectividad completados. Continuando con tests de API..."

      # 3. Checkout del archivo de tests
      - name: Checkout test files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            session.hurl
          sparse-checkout-cone-mode: false

      # 4. Instalar Hurl
      - name: Setup Hurl (API testing tool)
        uses: gacts/install-hurl@v1

      # 5. Ejecutar tests de API en Azure
      - name: Run API tests on Azure
        run: |
          echo " Ejecutando tests de API en Azure..."
          hurl \
            --variable host=https://${{ env.AZURE_WEBAPP_URL }} \
            --connect-timeout 20s \
            --retry 3 \
            --retry-interval 5000 \
            --error-format long \
            --verbose \
            --test \
            session.hurl
          echo " Tests de API completados exitosamente"

  # ========================================
  # JOB 4: Verificar logs y monitoreo
  # ========================================
  verify-monitoring:
    name: 'Verificar logs en Axiom y Azure'
    runs-on: ubuntu-latest
    needs: test-deployment

    steps:
      - name: Deployment summary
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║            DEPLOYMENT COMPLETADO EXITOSAMENTE           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo " URL de la aplicación:"
          echo "   https://${{ env.AZURE_WEBAPP_URL }}"
          echo ""
          echo " Imagen Docker desplegada:"
          echo "   ${{ env.IMAGE_URL }}"
          echo ""
          echo " Verifica los logs en:"
          echo "   • Axiom: https://app.axiom.co"
          echo "   • Azure Application Insights: https://portal.azure.com"
          echo ""
          echo " Todos los tests pasaron exitosamente"
