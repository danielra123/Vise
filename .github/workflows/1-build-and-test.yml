

name: Build and Test (Docker)

on:
  # Ejecutar manualmente
  workflow_dispatch:
    inputs:
      PORT:
        description: 'Puerto de la aplicación'
        required: true
        default: "3000"

  # Ejecutar en cada push a main (opcional)
  push:
    branches:
      - main

  # Ejecutar en cada pull request (opcional)
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 'Construir imagen Docker y ejecutar tests'
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Docker
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Construir imagen Docker
      - name: Build Docker image
        run: |
          echo " Construyendo imagen Docker..."
          docker build -t vise-api:latest .
          echo " Imagen construida exitosamente"

      # 4. Verificar que la imagen existe
      - name: Verify Docker image
        run: |
          echo " Imágenes Docker disponibles:"
          docker images | grep vise-api

      # 5. Levantar contenedor
      - name: Run container
        run: |
          echo " Levantando contenedor..."
          docker run -d -p ${{ github.event.inputs.PORT || 3000 }}:3000 --name vise-api vise-api:latest
          echo " Esperando que el contenedor esté listo..."
          sleep 10

      # 6. Verificar que el contenedor está corriendo
      - name: Check container status
        run: |
          echo " Estado del contenedor:"
          docker ps -a
          echo ""
          echo " Logs del contenedor:"
          docker logs vise-api

      # 7. Instalar herramienta de testing (Hurl)
      - name: Setup Hurl (API testing tool)
        uses: gacts/install-hurl@v1

      # 8. Ejecutar tests de la API
      - name: Test API with Hurl
        run: |
          echo " Ejecutando tests de la API..."
          hurl \
            --variable host=http://localhost:${{ github.event.inputs.PORT || 3000 }} \
            --error-format long \
            --verbose \
            --test \
            session.hurl
          echo " Tests completados exitosamente"

      # 9. Mostrar logs finales si hay error
      - name: Show container logs on failure
        if: failure()
        run: |
          echo " Tests fallaron. Mostrando logs del contenedor:"
          docker logs vise-api

      # 10. Limpiar contenedor
      - name: Cleanup
        if: always()
        run: |
          echo " Limpiando contenedor..."
          docker stop vise-api || true
          docker rm vise-api || true

  # Job adicional: Análisis de seguridad de la imagen
  security-scan:
    name: 'Escaneo de seguridad de la imagen'
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vise-api:latest .

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vise-api:latest'
          format: 'table'
          exit-code: '0'  # No fallar el workflow por vulnerabilidades
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
